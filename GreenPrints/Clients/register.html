<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <!-- إعدادات الـ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="البصمات الخضراء">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <title>تسجيل حساب فرد جديد - منصة البصمات الخضراء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col text-gray-800 relative selection:bg-indigo-500 selection:text-white">

  <!-- إشعار عائم -->
  <div id="toast-notification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2 space-x-reverse transition-all duration-300">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">تمت العملية بنجاح</span>
  </div>

  <!-- الشريط العلوي للمنصة -->
  <header class="w-full bg-slate-900 border-b border-slate-800 py-4 px-6 sm:px-10 flex justify-between items-center z-40 shrink-0">
    <div class="flex items-center space-x-3 space-x-reverse">
      <button onclick="goBack()" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 flex items-center justify-center transition shadow-sm" title="العودة لتسجيل الدخول">
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
      <span class="text-xs sm:text-sm font-bold text-white tracking-wide">منصة البصمات الخضراء</span>
    </div>
    <div class="text-xs text-slate-400 font-medium hidden sm:block">حساب فرد جديد</div>
  </header>

  <!-- المحتوى الأساسي بملء الشاشة وبمرونة تامة -->
  <main class="flex-1 w-full max-w-lg mx-auto px-4 sm:px-6 py-10 flex flex-col justify-center items-center">
    
    <div class="bg-white w-full shadow-2xl rounded-3xl p-6 sm:p-8 border border-gray-100 flex flex-col justify-between space-y-6">
      
      <div class="space-y-6">
        <div class="text-center space-y-2">
          <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1 class="text-lg sm:text-xl font-black text-indigo-900">حساب فرد جديد</h1>
          <p class="text-xs text-gray-400 font-semibold">قم بتعبئة البيانات أدناه لإنشاء حسابك في النظام</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-4 text-xs font-semibold">
          
          <!-- شبكة الحقول لتصميم احترافي واسع -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- الاسم الكامل -->
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1.5">الاسم الكامل</label>
              <input type="text" id="reg-name" required placeholder="اسم المستفيد" class="w-full border border-gray-200 px-3 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
            </div>

            <!-- رقم الهوية الوطنية -->
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1.5">رقم الهوية الوطنية</label>
              <input type="text" id="reg-national-id" required placeholder="10 أرقام" maxlength="10" pattern="\d{10}" title="يجب أن يتكون رقم الهوية من 10 أرقام" class="w-full border border-gray-200 px-3 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
            </div>

            <!-- رقم الجوال -->
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1.5">رقم الجوال</label>
              <input type="text" id="reg-phone" required placeholder="05xxxxxxxx" maxlength="10" pattern="\d{10}" title="يجب أن يتكون رقم الجوال من 10 أرقام" class="w-full border border-gray-200 px-3 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
            </div>

            <!-- المدينة -->
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1.5">المدينة</label>
              <input type="text" id="reg-city" required placeholder="المدينة" class="w-full border border-gray-200 px-3 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
            </div>
          </div>

          <!-- البريد الإلكتروني -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">البريد الإلكتروني</label>
            <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full border border-gray-200 px-3 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
          </div>

          <!-- كلمة المرور مع زر العين -->
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور</label>
            <div class="relative">
              <input type="password" id="reg-password" required placeholder="••••••••" class="w-full border border-gray-200 pr-3 pl-10 py-3 rounded-xl outline-none focus:border-indigo-500 text-gray-800 text-xs shadow-sm">
              <button type="button" onclick="togglePassword()" class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 hover:text-indigo-600 focus:outline-none">
                <i id="eye-icon" class="fa-solid fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2 space-x-reverse mt-2 text-xs">
            <span>حفظ وتسجيل الحساب</span>
            <i class="fa-solid fa-check text-xs"></i>
          </button>
        </form>
      </div>

      <div class="text-center pt-4 border-t border-gray-100 text-xs text-gray-500 shrink-0">
        <a href="login.html" class="font-bold hover:text-indigo-600">لديك حساب بالفعل؟ <span class="text-indigo-600">تسجيل الدخول</span></a>
      </div>

    </div>

  </main>

  <!-- تذييل الصفحة -->
  <footer class="w-full py-4 text-center text-slate-500 text-xs border-t border-slate-900 bg-slate-950 shrink-0">
    منصة البصمات الخضراء &copy; 2026 - جميع الحقوق محفوظة
  </footer>

  <!-- JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBE-mGCcnUCgscoECF-4ncW0ZuB57Uo6CM",
      authDomain: "green-prints-c6f65.firebaseapp.com",
      projectId: "green-prints-c6f65",
      storageBucket: "green-prints-c6f65.firebasestorage.app",
      messagingSenderId: "726286369175",
      appId: "1:726286369175:web:3137f5597c177aeb8c84d2",
      measurementId: "G-7XLHB3RSZR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.goBack = function() {
      window.location.href = "login.html";
    };

    window.showToast = function(msg, type = 'success') {
      const toast = document.getElementById('toast-notification');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      text.innerText = msg;
      if (type === 'error') {
        icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-sm";
      } else {
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
      }

      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    };

    window.togglePassword = function() {
      const passwordInput = document.getElementById('reg-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.className = "fa-solid fa-eye-slash text-xs";
      } else {
        passwordInput.type = 'password';
        eyeIcon.className = "fa-solid fa-eye text-xs";
      }
    };

    window.handleRegister = async function(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const nationalId = document.getElementById('reg-national-id').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const city = document.getElementById('reg-city').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;

      try {
        let checkQuery = query(collection(db, "clients"), where("nationalId", "==", nationalId));
        let checkSnapshot = await getDocs(checkQuery);

        if (checkSnapshot.empty && !isNaN(nationalId)) {
          checkQuery = query(collection(db, "clients"), where("nationalId", "==", Number(nationalId)));
          checkSnapshot = await getDocs(checkQuery);
        }

        if (!checkSnapshot.empty) {
          showToast("رقم الهوية الوطنية مسجل مسبقاً في النظام", "error");
          return;
        }

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "clients", user.uid), {
          name: name,
          nationalId: nationalId,
          phone: phone,
          city: city,
          email: email,
          createdAt: new Date()
        });

        await signOut(auth);
        localStorage.clear();

        showToast("تم إنشاء الحساب بنجاح، جاري الانتقال لتسجيل الدخول", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      } catch (error) {
        console.error("Register Error:", error);
        showToast("حدث خطأ، يرجى التأكد من البيانات أو البريد مستخدم مسبقاً", "error");
      }
    };
  </script>
</body>
</html>
