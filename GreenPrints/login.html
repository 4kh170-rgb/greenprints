<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - منصة البصمات الخضراء</title>
  
  <!-- إعدادات PWA والأيقونات -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="البصمات الخضراء">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="icon" type="image/png" href="icon-512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered!'))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>

  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-gray-800 flex flex-col justify-between relative selection:bg-indigo-500 selection:text-white">

  <!-- إشعار عائم -->
  <div id="toast-notification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2 space-x-reverse transition-all duration-300">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">تمت العملية بنجاح</span>
  </div>

  <!-- الشريط العلوي الاحترافي -->
  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 py-4 px-6 sm:px-10 flex justify-between items-center z-40 shrink-0">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="w-9 h-9 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center text-base border border-indigo-500/30">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <span class="text-white font-bold text-sm tracking-wide">منصة البصمات الخضراء</span>
    </div>
    <button onclick="goBack()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 px-4 rounded-xl border border-slate-700 flex items-center space-x-2 space-x-reverse transition shadow-sm" title="العودة للرئيسية">
      <i class="fa-solid fa-arrow-right text-xs"></i>
      <span>الرئيسية</span>
    </button>
  </header>

  <!-- المحتوى الرئيسي لملء الشاشة بمرونة -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 p-6 sm:p-8 space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-sm border border-indigo-100/60">
          <i class="fa-solid fa-leaf"></i>
        </div>
        <h1 class="text-xl font-black text-indigo-900">تسجيل الدخول</h1>
        <p class="text-xs text-gray-400 font-semibold">أدخل بيانات الحساب للمتابعة إلى لوحة التحكم</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4 text-xs font-semibold">
        <!-- حقل السجل التجاري أو الهوية -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5" id="input-label">رقم السجل التجاري / رقم الهوية</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-id-card text-xs"></i>
            </span>
            <input type="text" id="login-identifier" required placeholder="أدخل السجل أو الهوية (10 أرقام)" maxlength="10" class="w-full border border-gray-200 pr-10 pl-3 py-3 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-gray-800 text-xs transition">
          </div>
        </div>

        <!-- كلمة المرور مع زر العين -->
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور</label>
          <div class="relative">
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full border border-gray-200 pr-3 pl-10 py-3 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-gray-800 text-xs transition">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-400 hover:text-indigo-600 focus:outline-none">
              <i id="eye-icon" class="fa-solid fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <a href="forgot-password.html" class="text-indigo-600 font-bold hover:underline">نسيت كلمة المرور؟</a>
          <a href="register.html" class="text-gray-500 font-bold hover:text-indigo-600">ليس لديك حساب؟ <span class="text-indigo-600 underline">سجل الآن</span></a>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2 space-x-reverse mt-2 text-xs">
          <span>تسجيل الدخول</span>
          <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
        </button>
      </form>

    </div>
  </main>

  <!-- تذييل الصفحة -->
  <footer class="w-full py-4 text-center text-slate-500 text-[11px] shrink-0 border-t border-slate-900 bg-slate-950">
    منصة البصمات الخضراء &copy; 2026 - جميع الحقوق محفوظة
  </footer>

  <!-- JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBE-mGCcnUCgscoECF-4ncW0ZuB57Uo6CM",
      authDomain: "green-prints-c6f65.firebaseapp.com",
      projectId: "green-prints-c6f65",
      storageBucket: "green-prints-c6f65.firebasestorage.app",
      messagingSenderId: "726286369175",
      appId: "1:726286369175:web:3137f5597c177aeb8c84d2",
      measurementId: "G-7XLHB3RSZR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.goBack = function() {
      const currentPath = window.location.pathname;
      if (currentPath.includes('/merchants/')) {
        window.location.href = "../index.html";
      } else {
        window.location.href = "index.html";
      }
    };

    window.showToast = function(msg, type = 'success') {
      const toast = document.getElementById('toast-notification');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      text.innerText = msg;
      if (type === 'error') {
        icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-sm";
      } else {
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
      }

      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    };

    window.togglePassword = function() {
      const passwordInput = document.getElementById('login-password');
      const eyeIcon = document.getElementById('eye-icon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.className = "fa-solid fa-eye-slash text-xs";
      } else {
        passwordInput.type = 'password';
        eyeIcon.className = "fa-solid fa-eye text-xs";
      }
    };

    window.handleLogin = async function(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;

      if (identifier.length !== 10) {
        showToast("يجب أن يتكون الرقم المدخل من 10 خانات بالضبط", "error");
        return;
      }

      try {
        await signOut(auth);
        localStorage.clear();

        let collectionName = "";
        let queryField = "";
        let redirectPage = "";

        if (identifier.startsWith("700")) {
          collectionName = "merchants";
          queryField = "commercialRecord";
          redirectPage = "merchants/dashboard_2.html";
        } else if (identifier.startsWith("1")) {
          collectionName = "merchants"; 
          queryField = "nationalId"; 
          redirectPage = "dashboard_1.html";
        } else {
          showToast("الرقم المدخل غير صحيح", "error");
          return;
        }

        let q = query(collection(db, collectionName), where(queryField, "==", identifier));
        let querySnapshot = await getDocs(q);

        if (querySnapshot.empty && !isNaN(identifier)) {
          q = query(collection(db, collectionName), where(queryField, "==", Number(identifier)));
          querySnapshot = await getDocs(q);
        }

        if (querySnapshot.empty) {
          showToast("الرقم المدخل غير مسجل في النظام", "error");
          return;
        }

        let userEmail = "";
        let entityName = "";
        
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          userEmail = data.email;
          entityName = data.officeName || data.name || "المستخدم";
        });

        if (!userEmail) {
          showToast("البريد الإلكتروني المرتبط بهذا الحساب غير موجود", "error");
          return;
        }

        await signInWithEmailAndPassword(auth, userEmail, password);
        
        localStorage.setItem("currentOfficeCR", identifier);
        localStorage.setItem("currentOfficeName", entityName);

        showToast(`تم تسجيل الدخول بنجاح (${entityName})`, "success");
        
        setTimeout(() => {
          window.location.href = redirectPage;
        }, 1200);

      } catch (error) {
        console.error("Login Error:", error);
        showToast("خطأ في الرقم المدخل أو كلمة المرور", "error");
      }
    };
  </script>
</body>
</html>
