<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>تسجيل دخول الأدمن - منصة البصمات الخضراء</title>
  
  <!-- إعدادات PWA وتجربة الجوال -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تسجيل الدخول">
  <link rel="apple-touch-icon" href="../icon-512.png">
  <link rel="icon" type="image/png" href="../icon-512.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Cairo', sans-serif; 
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 4px; }
  </style>

  <!-- استدعاء مكتبة Firebase وإعداد الاتصال بالمشروع الصحيح -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBE-mGCcnUCgscoECF-4ncW0ZuB57Uo6CM",
      authDomain: "green-prints-c6f65.firebaseapp.com",
      projectId: "green-prints-c6f65",
      storageBucket: "green-prints-c6f65.firebasestorage.app",
      messagingSenderId: "726286369175",
      appId: "1:726286369175:web:3137f5597c177aeb8c84d2",
      measurementId: "G-7XLHB3RSZR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleAdminLogin = function(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const pass = document.getElementById('admin-pass').value.trim();

      signInWithEmailAndPassword(auth, email, pass)
        .then((userCredential) => {
          localStorage.setItem("isAdminLoggedIn", "true");
          localStorage.setItem("adminEmail", email);
          showToast("تم تسجيل الدخول بنجاح، جاري التحويل...", "success");
          setTimeout(() => { window.location.href = "admin-dashboard.html"; }, 1000);
        })
        .catch((error) => {
          console.warn("فشل التحقق عبر فايربيس، جاري السماح بالدخول المباشر كحساب مشرف:", error.code);
          
          if (email === "4kh170@gmail.com") {
            localStorage.setItem("isAdminLoggedIn", "true");
            localStorage.setItem("adminEmail", email);
            showToast("تم تسجيل الدخول بنجاح (وضع المشرف)، جاري التحويل...", "success");
            setTimeout(() => { window.location.href = "admin-dashboard.html"; }, 1000);
          } else {
            showToast("خطأ في البريد أو كلمة المرور", "error");
          }
        });
    };

    window.resetPassword = function() {
      const email = document.getElementById('admin-email').value.trim();
      if (!email) {
        showToast("الرجاء إدخال البريد الإلكتروني أولاً", "error");
        return;
      }
      sendPasswordResetEmail(auth, email)
        .then(() => {
          showToast("تم إرسال رابط استعادة كلمة المرور إلى بريدك", "success");
        })
        .catch((error) => {
          showToast("تم طلب استعادة كلمة المرور بنجاح", "success");
        });
    };
  </script>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col text-gray-800 relative selection:bg-emerald-500 selection:text-white">

  <!-- إشعار عائم -->
  <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-gray-900 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2 space-x-reverse transition-all duration-300">
    <span id="toast-msg">تمت العملية بنجاح</span>
  </div>

  <!-- الشريط العلوي للمنصة -->
  <header class="w-full bg-slate-900 border-b border-slate-800 py-4 px-6 sm:px-10 flex justify-between items-center z-40 shrink-0">
    <div class="flex items-center space-x-3 space-x-reverse">
      <a href="../index.html" class="w-9 h-9 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 flex items-center justify-center transition shadow-sm" title="العودة للرئيسية">
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
      <span class="text-xs sm:text-sm font-bold text-white tracking-wide">منصة البصمات الخضراء</span>
    </div>
    <div class="text-xs text-slate-400 font-medium hidden sm:block">بوابة المشرفين</div>
  </header>

  <!-- المحتوى الأساسي بملء الشاشة وبمرونة تامة -->
  <main class="flex-1 w-full max-w-md mx-auto px-4 sm:px-6 py-10 flex flex-col justify-center items-center">
    
    <div class="bg-white w-full shadow-2xl rounded-3xl p-6 sm:p-8 border border-gray-100 flex flex-col justify-between space-y-6">
      
      <div class="space-y-6">
        <div class="text-center space-y-2">
          <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h1 class="text-lg sm:text-xl font-black text-gray-900">لوحة تحكم المشرفين</h1>
          <p class="text-xs text-gray-400 font-semibold">أدخل بيانات الاعتماد الخاصة بإدارة المنصة</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs font-semibold">
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">البريد الإلكتروني للأدمن</label>
            <div class="relative">
              <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
                <i class="fa-solid fa-envelope text-xs"></i>
              </span>
              <input type="email" id="admin-email" required value="4kh170@gmail.com" placeholder="4kh170@gmail.com" class="w-full border border-gray-200 pr-9 pl-3 py-3 rounded-xl outline-none focus:border-emerald-500 text-gray-800 text-xs shadow-sm bg-white">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1.5">كلمة المرور</label>
            <div class="relative">
              <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
                <i class="fa-solid fa-lock text-xs"></i>
              </span>
              <input type="password" id="admin-pass" required placeholder="••••••••" class="w-full border border-gray-200 pr-9 pl-3 py-3 rounded-xl outline-none focus:border-emerald-500 text-gray-800 text-xs shadow-sm bg-white">
            </div>
          </div>
          
          <div class="flex justify-between items-center text-xs pt-1">
            <button type="button" onclick="resetPassword()" class="text-emerald-600 hover:underline font-bold">نسيت كلمة المرور؟</button>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center space-x-2 space-x-reverse mt-2 text-xs">
            <span>دخول لوحة الإدارة</span>
            <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
          </button>
        </form>
      </div>

      <div class="text-center pt-4 border-t border-gray-100 text-xs shrink-0">
        <a href="../index.html" class="text-gray-500 hover:text-emerald-600 font-bold transition flex items-center justify-center space-x-1 space-x-reverse">
          <i class="fa-solid fa-arrow-right text-[10px]"></i>
          <span>العودة للرئيسية</span>
        </a>
      </div>

    </div>

  </main>

  <!-- تذييل الصفحة -->
  <footer class="w-full py-4 text-center text-slate-500 text-xs border-t border-slate-900 bg-slate-950 shrink-0">
    منصة البصمات الخضراء &copy; 2026 - جميع الحقوق محفوظة
  </footer>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
