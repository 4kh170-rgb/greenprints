<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- إعدادات الـ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="البصمات الخضراء">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <title>استعادة كلمة المرور - منصة البصمات الخضراء</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 min-h-screen text-gray-800 flex flex-col justify-between relative selection:bg-indigo-500 selection:text-white">

  <!-- إشعار عائم -->
  <div id="toast-notification" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden bg-gray-900 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-2xl flex items-center space-x-2 space-x-reverse transition-all duration-300">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-message">تمت العملية بنجاح</span>
  </div>

  <!-- الشريط العلوي الاحترافي -->
  <header class="w-full bg-slate-900/80 backdrop-blur-md border-b border-slate-800 py-4 px-6 sm:px-10 flex justify-between items-center z-40 shrink-0">
    <div class="flex items-center space-x-3 space-x-reverse">
      <div class="w-9 h-9 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center text-base border border-indigo-500/30">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <span class="text-white font-bold text-sm tracking-wide">منصة البصمات الخضراء</span>
    </div>
    <a href="login.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 px-4 rounded-xl border border-slate-700 flex items-center space-x-2 space-x-reverse transition shadow-sm" title="العودة لتسجيل الدخول">
      <i class="fa-solid fa-arrow-right text-xs"></i>
      <span>تسجيل الدخول</span>
    </a>
  </header>

  <!-- المحتوى الرئيسي لملء الشاشة بمرونة -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-gray-100 p-6 sm:p-8 space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl shadow-sm border border-amber-100/60">
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 class="text-xl font-black text-indigo-900">استعادة كلمة المرور</h1>
        <p class="text-xs text-gray-400 font-semibold">أدخل بريدك الإلكتروني المسجل لإرسال تعليمات إعادة التعيين</p>
      </div>

      <form onsubmit="handleResetPassword(event)" class="space-y-4 text-xs font-semibold">
        <div>
          <label class="block text-xs font-bold text-gray-600 mb-1.5">البريد الإلكتروني</label>
          <div class="relative">
            <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-gray-400">
              <i class="fa-solid fa-envelope text-xs"></i>
            </span>
            <input type="email" id="reset-email" required placeholder="name@example.com" class="w-full border border-gray-200 pr-10 pl-3 py-3 rounded-xl outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 text-gray-800 text-xs transition">
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-600/20 transition flex items-center justify-center space-x-2 space-x-reverse mt-2 text-xs">
          <span>إرسال رابط الاستعادة</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>

      <div class="text-center pt-4 border-t border-gray-100 text-xs text-gray-400">
        <a href="login.html" class="text-gray-500 font-bold hover:text-indigo-600 transition">تذكرت كلمة المرور؟ <span class="text-indigo-600 underline">تسجيل الدخول</span></a>
      </div>

    </div>
  </main>

  <!-- تذييل الصفحة -->
  <footer class="w-full py-4 text-center text-slate-500 text-[11px] shrink-0 border-t border-slate-900 bg-slate-950">
    جميع الحقوق محفوظة &copy; 2026 - منصة البصمات الخضراء
  </footer>

  <!-- JavaScript -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBE-mGCcnUCgscoECF-4ncW0ZuB57Uo6CM",
      authDomain: "green-prints-c6f65.firebaseapp.com",
      projectId: "green-prints-c6f65",
      storageBucket: "green-prints-c6f65.firebasestorage.app",
      messagingSenderId: "726286369175",
      appId: "1:726286369175:web:3137f5597c177aeb8c84d2",
      measurementId: "G-7XLHB3RSZR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.showToast = function(msg, type = 'success') {
      const toast = document.getElementById('toast-notification');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-message');

      text.innerText = msg;
      if (type === 'error') {
        icon.className = "fa-solid fa-circle-exclamation text-rose-400 text-sm";
      } else {
        icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm";
      }

      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 3500);
    };

    window.handleResetPassword = async function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();

      try {
        await sendPasswordResetEmail(auth, email);
        showToast("تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2500);
      } catch (error) {
        showToast("تعذر إرسال الرابط، تأكد من صحة البريد الإلكتروني المسجل", "error");
      }
    };
  </script>
</body>
</html>
